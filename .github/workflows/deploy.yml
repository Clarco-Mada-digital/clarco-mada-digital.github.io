name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois, sans annuler un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Les tests gardent les deux fonctions qui cassent en silence : la
      # résolution des URL d'images (invisible en local, visible seulement une
      # fois en ligne) et l'échappement du code des labos.
      - name: Tests
        run: npm test

      # NB : `npm run check` (astro check) n'est pas encore dans la chaîne
      # bloquante — il remonte 86 erreurs de types préexistantes, surtout des
      # déclarations manquantes (@types/alpinejs, pdfmake). À traiter avant de
      # l'ajouter ici, sinon plus aucun déploiement ne passe.

      - name: Build
        run: npm run build
        env:
          # Dépôt "utilisateur" (clarco-mada-digital.github.io) → servi à la racine.
          SITE_URL: https://clarco-mada-digital.github.io
          # Pas de BASE_PATH nécessaire (site à la racine). Si un jour tu passes
          # sur un dépôt "projet" (URL .../<repo>/), ajoute : BASE_PATH: /<repo>
          #
          # Clés via secrets GitHub (Settings > Secrets and variables > Actions) :
          # WEB3FORMS_KEY (formulaire de contact) et CF_ANALYTICS_TOKEN
          # (Cloudflare Web Analytics). Hors du dépôt : un fork n'hérite pas des
          # clés (elles restent toutefois visibles dans le code livré du site —
          # clés publiques par conception).
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Audit du portfolio par Argus — mon propre outil, appliqué à mon propre
  # site. Volontairement non bloquant : il reste des remontées « Élevé » qui
  # sont des faux positifs connus (voir argus.config.json), et un déploiement
  # ne doit pas échouer pour ça. Le rapport est publié en artefact.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyse Argus
        run: npx --yes github:Clarco-Mada-digital/argus scan . --html argus-rapport.html
        continue-on-error: true

      - name: Publier le rapport
        uses: actions/upload-artifact@v4
        with:
          name: argus-rapport
          path: argus-rapport.html
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
